# =============================================================================
# Kong Gateway — Kong + Postgres + pgAdmin + Konga
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v
#
# Host ports avoid common local conflicts (workorder :8002, k8s Kong :8000):
#   Kong proxy:     http://localhost:18000
#   Kong Admin API: http://localhost:18001
#   Kong Manager:   http://localhost:18002
#   Konga UI:       http://localhost:1337
#   pgAdmin:        http://localhost:5051  (admin@local.dev / admin)
#   Kong Postgres:  localhost:15432        (kong / kong)  — Kong config DB
#   Konga Postgres: localhost:15433        (konga / konga) — Konga UI DB (PG11)
#
# Why two Postgres?
#   Kong runs on modern Postgres 16.
#   Konga 0.14.9 is archived and breaks on PG12+ (pg_constraint.consrc removed).
#
# Konga setup:
#   1. Open http://localhost:1337 and register an admin user
#   2. Add connection → Kong Admin URL: http://kong:8001
# =============================================================================

name: kong-gateway

x-kong-env: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-database
  KONG_PG_PORT: "5432"
  KONG_PG_DATABASE: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong

networks:
  kong-net:
    name: kong-net
    driver: bridge

volumes:
  kong_data: {}
  konga_data: {}
  kong_pgadmin_data: {}

services:
  kong-database:
    image: postgres:16-alpine
    container_name: kong-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "15432:5432"
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Konga needs Postgres <= 11 (archived GUI uses removed catalog columns)
  konga-database:
    image: postgres:11-alpine
    container_name: konga-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: konga
      POSTGRES_DB: konga
      POSTGRES_PASSWORD: konga
    ports:
      - "15433:5432"
    volumes:
      - konga_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga -d konga"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kong-migrations:
    image: kong:3.9.4
    container_name: kong-migrations
    restart: on-failure
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      <<: *kong-env
    networks:
      - kong-net

  kong:
    image: kong:3.9.4
    container_name: kong
    restart: unless-stopped
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      <<: *kong-env
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "18000:8000"   # Proxy HTTP
      - "18443:8443"   # Proxy HTTPS
      - "18001:8001"   # Admin API
      - "18444:8444"   # Admin API HTTPS
      - "18002:8002"   # Kong Manager UI (when present)
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: kong-pgadmin
    restart: unless-stopped
    user: root
    depends_on:
      kong-database:
        condition: service_healthy
      konga-database:
        condition: service_healthy
    environment:
      # Web login (email/password) — not desktop mode
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "5051:80"
    volumes:
      - kong_pgadmin_data:/var/lib/pgadmin
      # Do NOT mount as /pgadmin4/servers.json — that blocks boot. Import after UI is up.
      - ./kong/pgadmin/servers.json:/pgadmin4/servers.import.json:ro
      - ./kong/pgadmin/pgpass:/tmp/pgpass.source:ro
      - ./kong/pgadmin/bootstrap.sh:/pgadmin4/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/pgadmin4/bootstrap.sh"]
    networks:
      - kong-net

  konga-prepare:
    image: pantsel/konga:0.14.9
    container_name: konga-prepare
    restart: on-failure
    depends_on:
      konga-database:
        condition: service_healthy
    environment:
      DB_ADAPTER: postgres
      DB_HOST: konga-database
      DB_PORT: "5432"
      DB_USER: konga
      DB_PASSWORD: konga
      DB_DATABASE: konga
    command: "-c prepare -a postgres -u postgresql://konga:konga@konga-database:5432/konga"
    networks:
      - kong-net

  konga:
    image: pantsel/konga:0.14.9
    container_name: konga
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
      konga-prepare:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TOKEN_SECRET: kong-gateway-local-token-secret-change-me
      DB_ADAPTER: postgres
      DB_HOST: konga-database
      DB_PORT: "5432"
      DB_USER: konga
      DB_PASSWORD: konga
      DB_DATABASE: konga
    ports:
      - "1337:1337"
    networks:
      - kong-net
