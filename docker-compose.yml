# =============================================================================
# Kong Gateway — Kong + Postgres + pgAdmin + Konga
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v
#
# URLs:
#   Kong proxy:     http://localhost:8000
#   Kong Admin API: http://localhost:8001
#   Kong Manager:   http://localhost:8002  (if available in image)
#   Konga UI:       http://localhost:1337
#   pgAdmin:        http://localhost:5050  (admin@local.dev / admin)
#   Postgres:       localhost:15432        (kong / kong)
#
# Images (latest available as of Oct 2026):
#   kong:3.9.4              — Kong Gateway OSS
#   postgres:18-alpine      — PostgreSQL 18
#   dpage/pgadmin4:9.19     — pgAdmin 4
#   pantsel/konga:0.14.9    — Konga (last release; project archived)
#
# Konga setup:
#   1. Open http://localhost:1337 and register an admin user
#   2. Add connection → Kong Admin URL: http://kong:8001
# =============================================================================

name: kong-gateway

x-kong-env: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-database
  KONG_PG_PORT: "5432"
  KONG_PG_DATABASE: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong

networks:
  kong-net:
    name: kong-net
    driver: bridge

volumes:
  kong_data: {}
  kong_pgadmin_data: {}

services:
  kong-database:
    image: postgres:18-alpine
    container_name: kong-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "15432:5432"
    volumes:
      - kong_data:/var/lib/postgresql/data
      - ./kong/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kong-migrations:
    image: kong:3.9.4
    container_name: kong-migrations
    restart: "no"
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      <<: *kong-env
    networks:
      - kong-net

  kong:
    image: kong:3.9.4
    container_name: kong
    restart: unless-stopped
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      <<: *kong-env
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Admin reachable by Konga on the docker network (local/dev only)
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"   # Proxy HTTP
      - "8443:8443"   # Proxy HTTPS
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin API HTTPS
      - "8002:8002"   # Kong Manager UI (when present)
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: kong-pgadmin
    restart: unless-stopped
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - kong_pgadmin_data:/var/lib/pgadmin
      - ./kong/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./kong/pgadmin/pgpass:/tmp/pgpassfile:ro
    entrypoint: >
      /bin/sh -c "chmod 600 /tmp/pgpassfile &&
      /entrypoint.sh"
    networks:
      - kong-net

  konga-prepare:
    image: pantsel/konga:0.14.9
    container_name: konga-prepare
    restart: "no"
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: "5432"
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga
    command: "-c prepare -a postgres -u postgresql://kong:kong@kong-database:5432/konga"
    networks:
      - kong-net

  konga:
    image: pantsel/konga:0.14.9
    container_name: konga
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
      konga-prepare:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TOKEN_SECRET: kong-gateway-local-token-secret-change-me
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: "5432"
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga
    ports:
      - "1337:1337"
    networks:
      - kong-net
