# Kong Manager + Admin API behind HTTP Basic Auth (OSS has no built-in login).
server {
    listen 80;
    server_name _;

    auth_basic "Kong Manager";
    auth_basic_user_file /etc/nginx/htpasswd/.htpasswd;

    # Browser Manager UI
    location / {
        proxy_pass http://kong:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

# Admin API on a separate port so scripts can send Authorization: Basic
server {
    listen 81;
    server_name _;

    auth_basic "Kong Admin API";
    auth_basic_user_file /etc/nginx/htpasswd/.htpasswd;

    location / {
        proxy_pass http://kong:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
